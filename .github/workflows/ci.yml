name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "dummy_secret_for_ci"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Database
        run: |
          npx prisma generate
          npx prisma db push
          npx prisma db seed

      - name: Run Lint
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Run Performance Budgets
        run: npm run test:size

      - name: Run Unit Tests
        run: npm run test:run

      - name: Run E2E Tests (Cypress)
        run: npm run cy:run:ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests (Playwright)
        id: playwright
        run: npx playwright test
        continue-on-error: true

      - name: Commit new Playwright baselines
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts-snapshots/ tests/e2e/smoke.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "No new snapshots to commit"
          else
            git commit -m "⚙️ chore: update Playwright visual snapshots [linux]"
            git push
          fi

      - name: Fail if Playwright tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1

      - name: Run Accessibility Tests (Pa11y)
        run: npm run test:a11y:ci

      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Chromatic
        run: npm run chromatic -- --auto-accept-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
